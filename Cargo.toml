[dependencies]
bytes = "1.10.1"
config = "0.15.11"
futures-util = "0.3.31"
graphql-parser = "0.4.1"
http-body-util = "0.1.3"
hyper = { version = "1.6.0", features = ["full"] }
hyper-util = { version = "0.1.13", features = ["full"] }
